application: chromium-reviewbot
version: 1
runtime: python27
api_version: 1
threadsafe: true

inbound_services:
- mail

handlers:
- url: /_ah/mail/.*@.*\.appspotmail\.com$
  script: mail_dispatcher.app
  login: admin
- url: /admin/app_config
  script: app_config.app
  login: admin

libraries:
- name: jinja2
  version: 2.6
- name: pycrypto
  version: 2.6
- name: webapp2
  version: 2.5.2
- name: webob
  version: 1.2.3

admin_console:
  pages:
  - name: App Configuration
    url: /admin/app_config
